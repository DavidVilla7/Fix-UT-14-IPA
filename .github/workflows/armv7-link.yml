name: ARMv7 iOS linker and tweak package

on:
  push:
    paths:
      - "toolchain-smoke/**"
      - "local-ut/**"
      - ".github/workflows/armv7-link.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-armv7:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot file git libncurses6 libtinfo6 perl python3 unzip xz-utils

      - name: Install pinned Theos and ARMv7 iOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          git clone https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
          git -C "$THEOS" submodule update --init --depth 1

          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
          curl --fail --location --retry 3 \
            https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$THEOS/toolchain"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip" \
            https://github.com/growtopiajaw/iPhoneOS-SDK/releases/download/v1.0/iPhoneOS6.1.sdk.zip
          unzip -q "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip" -d "$THEOS/sdks"

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -d "$THEOS/sdks/iPhoneOS6.1.sdk"
          find "$THEOS/toolchain" -type f \( -name 'ld64*' -o -name 'ld' \) -print
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build the ARMv7 linker smoke sample
        run: make -C toolchain-smoke

      - name: Build experimental FIFA 14 tweak package
        run: make -C local-ut package

      - name: Verify and stage the package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          dylib="$(find toolchain-smoke/.theos/obj -type d -name '*.dSYM' -prune -o -type f -name 'LinkerSmoke.dylib' -print -quit)"
          test -n "$dylib"
          file "$dylib" | tee dist/linker-report.txt
          grep -E 'Mach-O.*armv7.*dynamically linked shared library' dist/linker-report.txt
          cp "$dylib" dist/LinkerSmoke.dylib

          deb="$(find local-ut -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = "com.davidvilla7.fifa14localut"
          test "$(dpkg-deb --field "$deb" Architecture)" = "iphoneos-arm"
          dpkg-deb --contents "$deb" | tee dist/deb-contents.txt
          cp "$deb" dist/FIFA14LocalUT_0.2.0_iphoneos-arm.deb

      - name: Publish experimental pre-release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 \
            --prerelease \
            --title "FIFA 14 Local UT 0.2.0 (experimental)" \
            --notes "Experimental ARMv7 MobileSubstrate tweak for FIFA 14 iOS. This package changes the Origin authenticator login callback to return a local empty success result. It has built successfully, but has NOT been validated on a physical iOS 10.3.3 device and does not provide a local FUT service, market database, or guaranteed offline progression. Back up the app data before installing. Package target: jailbroken 32-bit iOS with MobileSubstrate." \
            dist/FIFA14LocalUT_0.2.0_iphoneos-arm.deb

      - name: Upload the package and build report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: fifa14-local-ut-experimental-deb
          path: dist/
